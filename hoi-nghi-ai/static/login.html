<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — Hệ thống quản lý hội nghị khoa học</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
<div class="auth-card">
  <h1>Hệ thống quản lý hội nghị khoa học có tích hợp AI</h1>

  <div class="tabs">
    <button id="tab-login" class="tab active">Đăng nhập</button>
    <button id="tab-register" class="tab">Đăng ký</button>
  </div>

  <form id="form-login">
    <label>Email <input name="username" type="email" required></label>
    <label>Mật khẩu <input name="password" type="password" required></label>
    <button type="submit">Đăng nhập</button>
  </form>

  <form id="form-register" class="hidden">
    <label>Họ và tên <input name="full_name" required></label>
    <label>Email <input name="email" type="email" required></label>
    <label>Mật khẩu (tối thiểu 8 ký tự) <input name="password" type="password" minlength="8" required></label>
    <label>Vai trò
      <select name="role">
        <option value="author">Tác giả</option>
        <option value="reviewer">Phản biện</option>
      </select>
    </label>
    <button type="submit">Đăng ký</button>
  </form>

  <div id="auth-message" class="toast hidden"></div>
</div>
<script src="/static/login.js"></script>
</body>
</html>
